  <!-- Navbar -->
  <nav class="bg-white shadow-sm border-t border-gray-200 py-3">
    <div class="flex justify-around items-center max-w-screen-lg mx-auto">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link flex flex-col items-center gap-1 text-gray-600 hover:text-[#8B5A2B] transition-colors">
        <!-- Home Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span class="text-xs font-medium">Inicio</span>
      </a>

      <a routerLink="/categorias" routerLinkActive="active" class="nav-link flex flex-col items-center gap-1 text-gray-600 hover:text-[#8B5A2B] transition-colors">
        <!-- Categories Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
        <span class="text-xs font-medium">Categorías</span>
      </a>

      <a routerLink="/carshop" routerLinkActive="active" class="nav-link flex flex-col items-center gap-1 text-gray-600 hover:text-[#8B5A2B] transition-colors relative">
        <!-- Shopping Cart Icon -->
        <div class="relative">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
          <!-- Badge de cantidad -->
          <span 
            *ngIf="cantidadCarrito > 0"
            class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center animate-pulse"
          >
            {{cantidadCarrito}}
          </span>
        </div>
        <span class="text-xs font-medium">Carrito</span>
      </a>
