<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-600 via-purple-700 to-indigo-800 px-4 py-8">
  <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 w-full max-w-md transform transition-all duration-500 hover:scale-105">
    
    <!-- Logo -->
    <div class="flex justify-center mb-8">
      <img 
        src="logo_huipa.ico" 
        alt="Huipa Logo" 
        class="w-28 h-28 md:w-32 md:h-32 object-contain transition-transform duration-300 hover:scale-110 hover:rotate-6"
      />
    </div>

    <!-- Título -->
    <h1 class="text-3xl md:text-4xl font-bold text-center text-gray-800 mb-8">
      Registro
    </h1>

    <!-- Formulario -->
    <form (ngSubmit)="onSubmit()" class="space-y-6">
      
      <!-- Campo de Teléfono -->
      <div class="space-y-2">
        <label 
          for="phoneNumber" 
          class="block text-sm font-semibold text-gray-700"
        >
          Número de Teléfono <span class="text-red-500">*</span>
        </label>
        <input
          type="tel"
          id="phoneNumber"
          name="phoneNumber"
          [(ngModel)]="phoneNumber"
          (input)="onPhoneInput($event)"
          placeholder="1234567890"
          maxlength="10"
          required
          class="w-full px-4 py-3 text-base border-2 rounded-xl outline-none transition-all duration-300
                 focus:ring-4 focus:ring-purple-200 focus:border-purple-500
                 {{phoneNumber && !isPhoneValid ? 'border-red-500 bg-red-50' : ''}}
                 {{isPhoneValid ? 'border-green-500 bg-green-50' : 'border-gray-300'}}"
        />
        
        <!-- Mensaje de error -->
        <p 
          *ngIf="phoneNumber && !isPhoneValid" 
          class="text-xs text-red-600 flex items-center gap-1"
        >
          <span>⚠</span> Debe ser un número de 10 dígitos
        </p>
        
        <!-- Mensaje de validación exitosa -->
        <p 
          *ngIf="isPhoneValid" 
          class="text-xs text-green-600 flex items-center gap-1"
        >
          <span>✓</span> Número válido
        </p>
      </div>

      <!-- Campo de Contraseña -->
      <div class="space-y-2">
        <label 
          for="password" 
          class="block text-sm font-semibold text-gray-700"
        >
          Contraseña <span class="text-red-500">*</span>
        </label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Mínimo 8 caracteres"
          required
          class="w-full px-4 py-3 text-base border-2 rounded-xl outline-none transition-all duration-300
                 focus:ring-4 focus:ring-purple-200 focus:border-purple-500
                 {{password && !isPasswordValid ? 'border-red-500 bg-red-50' : ''}}
                 {{isPasswordValid ? 'border-green-500 bg-green-50' : 'border-gray-300'}}"
        />
        
        <!-- Mensaje de error -->
        <p 
          *ngIf="password && !isPasswordValid" 
          class="text-xs text-red-600 flex items-center gap-1"
        >
          <span>⚠</span> La contraseña debe tener al menos 8 caracteres
        </p>
        
        <!-- Mensaje de validación exitosa -->
        <p 
          *ngIf="isPasswordValid" 
          class="text-xs text-green-600 flex items-center gap-1"
        >
          <span>✓</span> Contraseña válida
        </p>
      </div>

      <!-- Botón de Login -->
      <button
        type="submit"
        [disabled]="!isFormValid"
        class="w-full py-4 text-lg font-bold text-white rounded-xl uppercase tracking-wider
               transition-all duration-300 transform
               {{isFormValid 
                 ? 'bg-gradient-to-r from-purple-600 to-indigo-700 hover:from-purple-700 hover:to-indigo-800 hover:-translate-y-1 hover:shadow-2xl cursor-pointer' 
                 : 'bg-gray-400 cursor-not-allowed opacity-60'}}"
      >
        Iniciar Sesión
      </button>
    </form>
  </div>
</div>
