<div class="min-h-screen flex items-center justify-center bg-primary-light px-4 py-8">
  <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 w-full max-w-md transform transition-all duration-500 hover:scale-105">
    
    <!-- Logo -->
    <div class="flex justify-center mb-8">
      <img 
        src="logo.jpg" 
        alt="Huipa Logo" 
        class="object-contain transition-transform duration-300 hover:scale-110 hover:rotate-6"
        style="width: 22rem; height: 13rem;"
      />
    </div>

    <!-- Título -->
    <h1 class="text-3xl md:text-4xl font-bold text-center text-primary mb-8">
      Iniciar Sesión
    </h1>

    <!-- Formulario -->
    <form (ngSubmit)="onSubmit()" class="space-y-6">
      
      <!-- Campo de Teléfono -->
      <div class="space-y-2">
        <label 
          for="phoneNumber" 
          class="block text-sm font-semibold text-gray-700"
        >
          Número de Teléfono <span class="text-red-500">*</span>
        </label>
        <input
          type="tel"
          id="phoneNumber"
          name="phoneNumber"
          [(ngModel)]="phoneNumber"
          (input)="onPhoneInput($event)"
          placeholder="1234567890"
          maxlength="10"
          required
          class="w-full px-4 py-3 text-base border-2 rounded-xl outline-none transition-all duration-300
                 focus:ring-4 focus:ring-accent/20 focus:border-accent
                 {{phoneNumber && !isPhoneValid ? 'border-red-500 bg-red-50' : ''}}
                 {{isPhoneValid ? 'border-accent bg-accent/5' : 'border-gray-300'}}"
        />
        
        <!-- Mensaje de error -->
        <p 
          *ngIf="phoneNumber && !isPhoneValid" 
          class="text-xs text-red-600 flex items-center gap-1"
        >
          <span>⚠</span> Debe ser un número de 10 dígitos
        </p>
        
        <!-- Mensaje de validación exitosa -->
        <p 
          *ngIf="isPhoneValid" 
          class="text-xs text-green-600 flex items-center gap-1"
        >
          <span>✓</span> Número válido
        </p>
      </div>

      <!-- Campo de Contraseña -->
      <div class="space-y-2">
        <label 
          for="password" 
          class="block text-sm font-semibold text-gray-700"
        >
          Contraseña <span class="text-red-500">*</span>
        </label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Mínimo 8 caracteres"
          required
          class="w-full px-4 py-3 text-base border-2 rounded-xl outline-none transition-all duration-300
                 focus:ring-4 focus:ring-accent/20 focus:border-accent
                 {{password && !isPasswordValid ? 'border-red-500 bg-red-50' : ''}}
                 {{isPasswordValid ? 'border-accent bg-accent/5' : 'border-gray-300'}}"
        />
        
        <!-- Mensaje de error -->
        <p 
          *ngIf="password && !isPasswordValid" 
          class="text-xs text-red-600 flex items-center gap-1"
        >
          <span>⚠</span> La contraseña debe tener al menos 8 caracteres
        </p>
        
        <!-- Mensaje de validación exitosa -->
        <p 
          *ngIf="isPasswordValid" 
          class="text-xs text-green-600 flex items-center gap-1"
        >
          <span>✓</span> Contraseña válida
        </p>
      </div>

      <!-- Botón de Login -->
      <button
        type="submit"
        [disabled]="!isFormValid"
        class="w-full py-4 text-lg font-bold text-white rounded-xl uppercase tracking-wider
               transition-all duration-300 transform
               {{isFormValid 
                 ? 'bg-gradient-to-r from-primary to-primary-dark hover:from-primary-dark hover:to-primary shadow-lg hover:-translate-y-1 hover:shadow-2xl cursor-pointer' 
                 : 'bg-gray-400 cursor-not-allowed opacity-60'}}"
      >
        Iniciar Sesión
      </button>

      <!-- Recuperar Contraseña -->
      <div class="text-center">
        <a 
          href="/reset-password" 
          class="text-sm text-primary hover:text-accent hover:underline transition-colors duration-200 font-medium"
        >
          ¿Olvidaste tu contraseña?
        </a>
      </div>
    </form>

    <!-- Crear Cuenta -->
    <div class="mt-8 text-center border-t border-primary/20 pt-6">
      <p class="text-gray-600 mb-3">
        ¿No tienes una cuenta?
      </p>
      <a 
        href="/register" 
        class="inline-block px-8 py-3 text-base font-bold text-accent border-2 border-accent rounded-xl
               hover:bg-accent hover:text-white transition-all duration-300 transform hover:-translate-y-1 hover:shadow-lg"
      >
        Crear Cuenta
      </a>
    </div>
  </div>
</div>
